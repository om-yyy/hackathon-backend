<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parcel Management Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
    }
    th {
      background-color: #334155;
      color: #38bdf8;
    }
    tr:nth-child(even) {
      background-color: #1e293b;
    }
    tr:nth-child(odd) {
      background-color: #0f172a;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      text-transform: uppercase;
    }
    .badge-vacant { background-color: #22c55e; color: #000; }
    .badge-occupied { background-color: #ef4444; color: #fff; }
    .badge-owned { background-color: #eab308; color: #000; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📍 Parcel Management System</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Owner</th>
          <th>Status</th>
          <th>Area (sq ft)</th>
        </tr>
      </thead>
      <tbody id="parcel-table-body">
        <tr>
          <td colspan="5" style="text-align:center;">Loading data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
